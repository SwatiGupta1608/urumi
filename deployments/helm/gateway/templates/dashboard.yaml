{{- if .Values.dashboard.enabled }}
{{- $name := include "gateway.component" (dict "ctx" . "component" "dashboard") -}}
{{- $d := .Values.dashboard -}}
{{- $gwName := include "gateway.component" (dict "ctx" . "component" "gateway") -}}
{{- $chat := $d.chat -}}
{{- $llm := $chat.provider -}}
{{- if and $llm.baseUrl (not (hasPrefix "https://" $llm.baseUrl)) }}
{{- fail "dashboard.chat.provider.baseUrl must be https://" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
data:
  CHAT_PROVIDER_BASE_URL: {{ $llm.baseUrl | quote }}
  CHAT_MODEL: {{ $llm.model | quote }}
  CHAT_PROVIDER_TIMEOUT_SECONDS: {{ $llm.timeoutSeconds | quote }}
  CHAT_MAX_OUTPUT_TOKENS: {{ $llm.maxOutputTokens | quote }}
  CHAT_MAX_STEPS: {{ $chat.maxSteps | quote }}
  CHAT_MAX_TOOL_CALLS: {{ $chat.maxToolCalls | quote }}
  CHAT_READONLY_TOOLS: {{ join "," $chat.readOnlyTools | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  # Internal only; no Ingress until there is an authentication/TLS design for it.
  type: ClusterIP
  selector:
    {{- include "gateway.selectorLabels" (dict "ctx" . "component" "dashboard") | nindent 4 }}
  ports:
    - name: http
      port: {{ $d.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ $d.replicas }}
  selector:
    matchLabels:
      {{- include "gateway.selectorLabels" (dict "ctx" . "component" "dashboard") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gateway.labels" . | nindent 8 }}
        app.kubernetes.io/component: dashboard
        # Admitted by the gateway's NetworkPolicy.
        {{- toYaml .Values.gateway.networkPolicy.clientPodLabels | nindent 8 }}
      annotations:
        checksum/chat-config: {{ toJson $chat | sha256sum }}
    spec:
      {{- include "gateway.podSecurity" (dict "uid" 10001) | nindent 6 }}
      containers:
        - name: dashboard
          image: {{ include "gateway.image" $d.image | quote }}
          imagePullPolicy: {{ $d.image.pullPolicy }}
          args: ["--port", "{{ $d.port }}"]
          envFrom:
            - configMapRef:
                name: {{ $name }}
          env:
            # Provider key (optional): chat stays "unavailable" if the Secret is absent.
            - name: CHAT_PROVIDER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $llm.apiKeySecret.name }}
                  key: {{ $llm.apiKeySecret.key }}
                  optional: true
            - name: GATEWAY_URL
              value: "http://{{ $gwName }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.gateway.port }}"
            - name: DASHBOARD_STATIC_DIR
              value: /app/web
            - name: DASHBOARD_SECURE_COOKIES
              value: {{ $d.secureCookies | quote }}
            - name: DASHBOARD_SESSION_IDLE_SECONDS
              value: {{ $d.sessionIdleSeconds | quote }}
            - name: DASHBOARD_SESSION_MAX_SECONDS
              value: {{ $d.sessionMaxSeconds | quote }}
          ports:
            - name: http
              containerPort: {{ $d.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          {{- include "gateway.containerSecurity" . | nindent 10 }}
          resources:
            {{- toYaml $d.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  podSelector:
    matchLabels:
      {{- include "gateway.selectorLabels" (dict "ctx" . "component" "dashboard") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  {{- with $d.networkPolicy.ingressFrom }}
  ingress:
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: http
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    {{- include "gateway.dnsEgress" . | nindent 4 }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "gateway.selectorLabels" (dict "ctx" . "component" "gateway") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.gateway.port }}
    {{- if $llm.baseUrl }}
    # LLM provider over HTTPS (private/cluster ranges excluded).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- toYaml $chat.providerEgressExcept | nindent 14 }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
{{- end }}
