{{- if .Values.dashboard.enabled }}
{{- $name := include "gateway.component" (dict "ctx" . "component" "dashboard") -}}
{{- $d := .Values.dashboard -}}
{{- $gwName := include "gateway.component" (dict "ctx" . "component" "gateway") -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  # Internal only; no Ingress until there is an authentication/TLS design for it.
  type: ClusterIP
  selector:
    {{- include "gateway.selectorLabels" (dict "ctx" . "component" "dashboard") | nindent 4 }}
  ports:
    - name: http
      port: {{ $d.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ $d.replicas }}
  selector:
    matchLabels:
      {{- include "gateway.selectorLabels" (dict "ctx" . "component" "dashboard") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gateway.labels" . | nindent 8 }}
        app.kubernetes.io/component: dashboard
        # Admitted by the gateway's NetworkPolicy.
        {{- toYaml .Values.gateway.networkPolicy.clientPodLabels | nindent 8 }}
    spec:
      {{- include "gateway.podSecurity" (dict "uid" 10001) | nindent 6 }}
      containers:
        - name: dashboard
          image: {{ include "gateway.image" $d.image | quote }}
          imagePullPolicy: {{ $d.image.pullPolicy }}
          args: ["--port", "{{ $d.port }}"]
          env:
            - name: GATEWAY_URL
              value: "http://{{ $gwName }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.gateway.port }}"
            - name: DASHBOARD_STATIC_DIR
              value: /app/web
            - name: DASHBOARD_SECURE_COOKIES
              value: {{ $d.secureCookies | quote }}
            - name: DASHBOARD_SESSION_IDLE_SECONDS
              value: {{ $d.sessionIdleSeconds | quote }}
            - name: DASHBOARD_SESSION_MAX_SECONDS
              value: {{ $d.sessionMaxSeconds | quote }}
          ports:
            - name: http
              containerPort: {{ $d.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          {{- include "gateway.containerSecurity" . | nindent 10 }}
          resources:
            {{- toYaml $d.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  podSelector:
    matchLabels:
      {{- include "gateway.selectorLabels" (dict "ctx" . "component" "dashboard") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  {{- with $d.networkPolicy.ingressFrom }}
  ingress:
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - protocol: TCP
          port: http
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    {{- include "gateway.dnsEgress" . | nindent 4 }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "gateway.selectorLabels" (dict "ctx" . "component" "gateway") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.gateway.port }}
{{- end }}
