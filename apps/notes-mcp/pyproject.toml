[project]
name = "notes-mcp"
version = "0.1.0"
description = "Team notes MCP server (Streamable HTTP) for the Urumi MCP Gateway"
requires-python = ">=3.12"
dependencies = [
    "mcp<2",
    "fastapi>=0.115,<1",
    "pydantic>=2.11,<3",
    "uvicorn>=0.34,<1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "httpx>=0.28,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
